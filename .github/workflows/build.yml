name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # The build needs the apps' and the tooling's dependencies, the QML
      # modules the applet imports (kf6-kirigami, libplasma), and kf6-kpackage
      # for kpackagetool6, which is what actually installs and validates the
      # `.plasmoid` archive.
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ ninja-build git zip \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            extra-cmake-modules kf6-ki18n-devel gettext \
            kf6-kirigami libplasma kf6-kpackage

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The checks need no Bluetooth hardware and no running desktop, so they are
      # the meaningful gate here: they cover the protocol codec, the model
      # profiles, the request queue, the connection state machine, the channel
      # scan, the EBUSY budget and the rapid connect/disconnect cycles.
      - name: Run the hardware-free checks
        run: |
          for t in moondrop-selftest moondrop-profile-check moondrop-conncheck \
                   moondrop-scan-check moondrop-ebusy-check moondrop-switch-check \
                   moondrop-watchstate-check moondrop-stress; do
            echo "::group::$t"
            ./build/cli/$t
          done

      - name: Render the UI checks
        run: ./scripts/run-ui-checks.sh /tmp/ui-checks

      - name: Check the translation catalogue
        run: ./scripts/update-translations.sh

      # A widget whose pages cannot be parsed is useless, so the QML is at least
      # linted.  qmllint needs no display, but Fedora puts it under the Qt lib
      # directory rather than on PATH.  Import warnings are expected here (the
      # applet's own module is not installed into this container), so what is
      # checked is that the tool ran at all and reported no errors.
      - name: Lint the QML
        run: |
          QMLLINT="$(command -v qmllint || echo /usr/lib64/qt6/bin/qmllint)"
          [ -x "$QMLLINT" ] || { echo "qmllint not found; install qt6-qtdeclarative-devel" >&2; exit 1; }
          find package/contents -name '*.qml' -print0 | xargs -0 -r -n1 "$QMLLINT"

      - name: Build the applet package
        run: ./scripts/make-plasmoid.sh dist

      # The store channel end to end: package, then install it through the real
      # KNewStuff client against a local OCS provider.  This is the check that
      # would have caught the bundled-module-name clash, so it runs on every
      # build rather than only before a release.  It needs the KNewStuff
      # development files, a Plasmashell to load the result in, and dbus-daemon
      # for the dbus-run-session that gives that plasmashell a session bus.
      - name: Install the store test dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            kf6-knewstuff-devel plasma-workspace dbus-daemon

      - name: Check the store channel end to end
        run: ./scripts/store-check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plasmoid
          path: dist/*.plasmoid

  # A release has to run on the *oldest* Qt its users have, because the loader
  # refuses a plugin built against a newer Qt than the host ("uses incompatible
  # Qt library").  The archive published from the job above is built on
  # fedora:latest, so it would only run on that Qt or newer; the one published
  # here is built on fedora:40 (Qt 6.8) and runs from there up.
  #
  # This is a separate job rather than a step in the one above because the
  # baseline Qt has to be the *job's* own environment.  Doing it from inside the
  # build container would mean running containers inside a container, which the
  # runner does not provide.  fedora:40 is the oldest image carrying both Qt 6
  # and the KF6 packages this project needs (Fedora 39 predates KF6).  It is
  # past end of life, so this job will eventually need moving to the next oldest
  # image that still has the packages - the build is the same everywhere, so
  # that is a one line change to the image below.
  baseline:
    name: package for the release on the oldest Qt
    runs-on: ubuntu-latest
    container: fedora:40
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake gcc-c++ ninja-build git zip \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            extra-cmake-modules kf6-ki18n-devel gettext \
            kf6-kirigami libplasma kf6-kpackage \
            kf6-knewstuff-devel plasma-workspace dbus-daemon

      - uses: actions/checkout@v4

      - name: Build against the baseline Qt
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          rpm -q qt6-qtbase

      # The archive is built and then proved, in the environment it is meant to
      # run in: the store check installs it through the real KNewStuff client
      # and loads it in a real plasmashell, on the oldest Qt.
      - name: Package and check the release archive
        run: |
          ./scripts/make-plasmoid.sh dist
          ./scripts/store-check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plasmoid-release
          path: dist/*.plasmoid

  release:
    name: attach the applet package to the release
    needs: [build, baseline]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The baseline archive, not the one the build job produced: it is the one
      # built on the oldest Qt and therefore the one that runs for everybody.
      - uses: actions/download-artifact@v4
        with:
          name: plasmoid-release
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.plasmoid \
            --repo "$GITHUB_REPOSITORY" --clobber

      # A source tarball as well, so the distribution packagers and the one line
      # installer have a stable artifact to point at.
      - name: Attach the source tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o dist/source.tar.gz \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          gh release upload "$GITHUB_REF_NAME" dist/source.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
